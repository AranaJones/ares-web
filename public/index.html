<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Web Chat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #00adb5; text-align: center; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input { flex: 1; padding: 10px; background: #2d2d2d; border: 1px solid #3d3d3d; border-radius: 6px; color: #fff; font-size: 14px; min-width: 120px; }
        input:focus { border-color: #00adb5; outline: none; }
        button { padding: 10px 20px; background: #00adb5; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #008c9e; }
        #status { font-size: 13px; color: #888; margin-bottom: 10px; font-style: italic; }
        #chat-box { height: 350px; background: #141414; border: 1px solid #2d2d2d; border-radius: 6px; overflow-y: auto; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { line-height: 1.4; }
        .msg-user { color: #00adb5; font-weight: bold; }
        .msg-sys { color: #ff2e63; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ares Galaxy Web Client</h2>
    
    <div class="form-row">
        <input type="text" id="ip" placeholder="Ares Server IP">
        <input type="number" id="port" placeholder="Port">
        <input type="text" id="username" placeholder="Username" value="AresGuest">
        <button onclick="connect()">Connect</button>
    </div>

    <div id="status">Status: Disconnected</div>
    <div id="chat-box"></div>

    <div class="form-row">
        <input type="text" id="message" placeholder="Type your message here..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Send</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const statusDiv = document.getElementById('status');

    function connect() {
        const ip = document.getElementById('ip').value;
        const port = document.getElementById('port').value;
        const username = document.getElementById('username').value;
        if(!ip || !port) return alert('Please enter an IP and Port');
        socket.emit('connect_ares', { ip, port, username });
    }

    function send() {
        const input = document.getElementById('message');
        if(input.value.trim() !== "") {
            socket.emit('send_message', input.value);
            appendMsg('You', input.value, 'msg-user');
            input.value = '';
        }
    }

    function appendMsg(user, text, className) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="${className}">${user}:</span> ${text}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    socket.on('status', (status) => statusDiv.innerText = `Status: ${status}`);
    socket.on('chat_message', (data) => appendMsg(data.user, data.text, 'msg-sys'));
</script>
</body>
</html>
