<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Web Chat Client</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        h2 { margin-top: 0; color: #00adb5; text-align: center; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input, select { flex: 1; padding: 10px; background: #2d2d2d; border: 1px solid #3d3d3d; border-radius: 6px; color: #fff; font-size: 14px; min-width: 110px; }
        input:focus { border-color: #00adb5; outline: none; }
        button { padding: 10px 20px; background: #00adb5; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #008c9e; }
        
        /* Channel List Styling */
        .sidebar { background: #141414; border: 1px solid #2d2d2d; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; height: 350px; overflow-y: auto; }
        .sidebar-title { font-weight: bold; color: #00adb5; font-size: 14px; border-bottom: 1px solid #2d2d2d; padding-bottom: 5px; margin-bottom: 5px; }
        .channel-item { padding: 8px; background: #222; border-radius: 4px; cursor: pointer; font-size: 13px; transition: background 0.2s; text-align: left; border: none; color: #fff; width: 100%; }
        .channel-item:hover { background: #00adb5; color: #fff; }
        .channel-item.active { background: #ff2e63; color: #fff; }

        /* Main Chat Window */
        .chat-area { display: flex; flex-direction: column; }
        #status { font-size: 13px; color: #888; margin-bottom: 10px; font-style: italic; }
        #chat-box { height: 350px; background: #141414; border: 1px solid #2d2d2d; border-radius: 6px; overflow-y: auto; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { line-height: 1.4; font-size: 14px; }
        .msg-user { color: #00adb5; font-weight: bold; }
        .msg-sys { color: #ff2e63; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="full-width">
        <h2>Ares Galaxy Web Client</h2>
        <div class="form-row">
            <input type="text" id="username" placeholder="Username" value="AresGuest">
            <button onclick="connectSelectedChannel()">Connect Securely</button>
        </div>
        <div id="status">Status: Disconnected</div>
    </div>

    <!-- Channels List Sidebar -->
    <div class="sidebar">
        <div class="sidebar-title">Available Channels</div>
        <!-- You can edit these names, IPs, and ports to point to real servers or hubs -->
        <button class="channel-item active" onclick="selectChannel(this, '12.34.56.78', '47624', 'Lobby')">🌐 General Lobby</button>
        <button class="channel-item" onclick="selectChannel(this, '98.76.54.32', '47625', 'Help Room')">💬 Help & Support</button>
        <button class="channel-item" onclick="selectChannel(this, '192.168.1.50', '23456', 'Music Hub')">🎵 Music Zone</button>
        <button class="channel-item" onclick="selectChannel(this, 'custom', 'custom', 'Custom')">🛠️ Custom Target...</button>
        
        <!-- Hidden Custom Inputs container -->
        <div id="custom-target-inputs" style="display:none; margin-top: 10px; flex-direction: column; gap: 5px;">
            <input type="text" id="ip" placeholder="Server IP">
            <input type="number" id="port" placeholder="Port">
        </div>
    </div>

    <!-- Chat Interaction Area -->
    <div class="chat-area">
        <div id="chat-box"></div>
        <div class="form-row">
            <input type="text" id="message" placeholder="Type your message here..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">Send</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const statusDiv = document.getElementById('status');
    
    // Track selected target channel configuration state
    let activeChannelConfig = { ip: '12.34.56.78', port: '47624', name: 'Lobby' };

    function selectChannel(element, ip, port, name) {
        // Toggle selection layout classes
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        const customInputs = document.getElementById('custom-target-inputs');
        if (ip === 'custom') {
            customInputs.style.display = 'flex';
            activeChannelConfig.name = 'Custom Room';
        } else {
            customInputs.style.display = 'none';
            activeChannelConfig = { ip, port, name };
        }
    }

    function connectSelectedChannel() {
        const username = document.getElementById('username').value;
        let finalIp = activeChannelConfig.ip;
        let finalPort = activeChannelConfig.port;

        if (finalIp === 'custom') {
            finalIp = document.getElementById('ip').value;
            finalPort = document.getElementById('port').value;
        }

        if(!finalIp || !finalPort) return alert('Please complete the custom target Server IP & Port settings.');
        
        chatBox.innerHTML = ''; // Wipe chat logs clean on room shift
        appendMsg('System', `Initiating channel handshake with [${activeChannelConfig.name}]...`, 'msg-sys');
        socket.emit('connect_ares', { ip: finalIp, port: parseInt(finalPort), username });
    }

    function send() {
        const input = document.getElementById('message');
        if(input.value.trim() !== "") {
            socket.emit('send_message', input.value);
            appendMsg('You', input.value, 'msg-user');
            input.value = '';
        }
    }

    function appendMsg(user, text, className) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="${className}">${user}:</span> ${text}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    socket.on('status', (status) => statusDiv.innerText = `Status: ${status}`);
    socket.on('chat_message', (data) => appendMsg(data.user, data.text, 'msg-sys'));
</script>
</body>
</html>

</script>
</body>
</html>
