<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Galaxy v2.x.x Client</title>
    <style>
        /* Classic Windows / Ares Palette Configurations */
        :root {
            --win-bg: #ece9d8; /* Vintage Windows XP base color style */
            --ares-metallic: #d6d9e4; 
            --ares-dark-grey: #3a3a3b;
            --ares-light-grey: #f4f3eb;
            --ares-blue: #004efe;
            --border-light: #ffffff;
            --border-dark: #808080;
        }

        * { box-sizing: border-box; font-family: "Tahoma", "Segoe UI", sans-serif; font-size: 12px; }

        body { background-color: #3b5998; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* Main Application Framed Window Container Box wrapper */
        .ares-application { width: 100%; max-width: 950px; background: var(--win-bg); border: 3px solid var(--ares-blue); border-radius: 4px 4px 0 0; box-shadow: 5px 5px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }

        /* Native Windows App OS Top Header Bar */
        .title-bar { background: linear-gradient(180deg, #0058f5 0%, #004efe 10%, #0124b1 100%); padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; color: white; font-weight: bold; text-shadow: 1px 1px 1px #000; }
        .title-controls div { width: 18px; height: 18px; background: #e04343; border: 1px solid #fff; display: inline-block; text-align: center; line-height: 14px; font-size: 12px; cursor: pointer; border-radius: 3px; font-weight: bold; box-shadow: 1px 1px 2px rgba(0,0,0,0.3); }

        /* Signature Ares P2P Top Horizontal Navigation Ribbon Array */
        .ares-nav-tabs { background: #f1f0e6; display: flex; border-bottom: 1px solid var(--border-dark); padding: 5px 6px 0 6px; gap: 3px; }
        .tab-item { background: #e1dfdd; border: 1px solid var(--border-dark); border-bottom: none; padding: 7px 15px; cursor: pointer; color: #222; border-radius: 4px 4px 0 0; display: flex; align-items: center; gap: 5px; box-shadow: 1px 1px 0px #fff inset; }
        .tab-item:hover { background: #fff; }
        .tab-item.active { background: #fff; font-weight: bold; border-bottom: 1px solid #fff; margin-bottom: -1px; position: relative; z-index: 5; }

        /* Sub Secondary Panel Toolbar Control Strip layout */
        .ares-sub-toolbar { background: var(--ares-light-grey); border-bottom: 1px solid #c0c0c0; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .user-config { display: flex; align-items: center; gap: 8px; }
        .user-config input { padding: 3px 6px; border: 2px inset #fff; width: 130px; }
        
        /* Core Two Column Screen Interface Layout Split Matrix Grid */
        .workspace-layout { display: grid; grid-template-columns: 260px 1fr; background: #ffffff; height: 450px; border: 2px inset #fff; }

        /* Left Sidebar Room Hub Navigation Column element frame profiles */
        .sidebar-rooms { background: #f0f0f0; border-right: 2px ridge #fff; display: flex; flex-direction: column; }
        .sidebar-header-strip { background: #556b98; color: white; padding: 5px 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header-strip button { font-size: 11px; padding: 2px 6px; cursor: pointer; background: #e1dfdd; border: 1px solid #777; font-weight: bold; }
        .rooms-scroller { flex: 1; overflow-y: scroll; padding: 4px; background: #fff; border: 1px inset #ccc; margin: 4px; }
        
        .channel-row { width: 100%; border: none; background: transparent; text-align: left; padding: 6px; cursor: pointer; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .channel-row:hover { background-color: #316ac5; color: white; }
        .channel-row .user-counter { color: #008000; font-weight: bold; font-family: monospace; }
        .channel-row:hover .user-counter { color: #fff; }

        /* Right Window Chat output display logs layout node frame */
        .chat-terminal-pane { display: flex; flex-direction: column; background: #ffffff; }
        .chat-display-box { flex: 1; overflow-y: scroll; padding: 15px; display: flex; flex-direction: column; gap: 5px; background: #ffffff; border-bottom: 2px inset #fff; }
        
        /* Native Ares formatting parameters */
        .msg-line { line-height: 1.4; font-family: "Courier New", monospace; font-size: 13px; color: #000; word-break: break-all; }
        .nick-user { color: #0000ff; font-weight: bold; }
        .nick-sys { color: #ff0000; font-style: italic; font-weight: bold; }

        /* Bottom entry input chat container tray layout options */
        .chat-input-tray { background: #f1f0e6; padding: 8px; display: flex; gap: 6px; border-top: 1px solid var(--border-dark); }
        .chat-input-tray input { flex: 1; padding: 6px; border: 2px inset #eee; font-family: "Courier New", monospace; font-size: 13px; }
        .chat-input-tray button { background: #e1dfdd; border: 1px solid var(--border-dark); padding: 5px 20px; font-weight: bold; cursor: pointer; box-shadow: 1px 1px 1px #fff inset; }
        .chat-input-tray button:active { border-style: inset; }

        /* Bottom Application Bar info tracker footer layer strip configuration options */
        .ares-footer-status { background: #ece9d8; border-top: 1px solid var(--border-dark); padding: 4px 10px; font-size: 11px; color: #444; display: flex; justify-content: space-between; border-radius: 0 0 3px 3px; }
    </style>
</head>
<body>

<div class="ares-application">
    <!-- Top System Title Panel Bar header wrapper framework -->
    <div class="title-bar">
        <span>Ares Galaxy v2.5.7 Client</span>
        <div class="title-controls">
            <div>X</div>
        </div>
    </div>

    <!-- Classic Ares Multi-Panel Application Window Ribbon Tabs Matrix Row list items -->
    <div class="ares-nav-tabs">
        <button class="tab-item">🔍 Search</button>
        <button class="tab-item">📥 Transfer</button>
        <button class="tab-item active">💬 Chat Room</button>
        <button class="tab-item">🎵 Library</button>
        <button class="tab-item">⚙️ Control Panel</button>
    </div>

    <!-- Network Configuration Status Utility ribbon bar framework layer metrics component modules -->
    <div class="ares-sub-toolbar">
        <div class="user-config">
            <label style="font-weight: bold; color: #333;">My Nickname: </label>
            <input type="text" id="username" value="AresUser">
        </div>
        <div id="connectionStatus" style="color: #008000; font-weight: bold; font-family: Tahoma;">Network State: Online (Supernode Bridge Active)</div>
    </div>

    <!-- Active Interface Window Screen matrix wrapper grid mapping structure links components -->
    <div class="workspace-layout">
        
        <!-- Left Side Server Hub Directory list browser pane block elements array stack link views -->
        <div class="sidebar-rooms">
            <div class="sidebar-header-strip">
                <span>Ares Chat Rooms</span>
                <button onclick="fetchLiveRooms()">Refresh List</button>
            </div>
            <div class="rooms-scroller" id="rooms-list">
                <div style="padding:15px; text-align:center; color:#888; font-style:italic;">Querying Ares directory hubs...</div>
            </div>
        </div>

        <!-- Right Side Room Screen terminal output message feed block container element fields -->
        <div class="chat-terminal-pane">
            <div class="chat-display-box" id="chat-box"></div>
            
            <!-- Message submission text field input block module form wrapper bar trigger framework -->
            <div class="chat-input-tray">
                <input type="text" id="message" placeholder="Select a live server room channel link from the left panel sidebar array to connect..." disabled onkeypress="if(event.key==='Enter') send()">
                <button id="send-btn" onclick="send()" disabled>Send</button>
            </div>
        </div>
    </div>

    <!-- Base Status Panel Application Footnote Strip logs wrapper indicators elements layers -->
    <div class="ares-footer-status">
        <span>Connected Network Nodes: 312,948 Users Online</span>
        <span>Decentralized Repository Size: 24.7 TB Shared Assets</span>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const roomsList = document.getElementById('rooms-list');
    const connectionStatus = document.getElementById('connectionStatus');
    const messageInput = document.getElementById('message');
    const sendBtn = document.getElementById('send-btn');

    function fetchLiveRooms() {
        roomsList.innerHTML = '<div style="padding:15px; text-align:center; color:#555;">Fetching live data...</div>';
        socket.emit('get_live_channels');
    }

    function showRoomMessage(text, color) {
        const div = document.createElement('div');
        div.style.cssText = `padding:15px; text-align:center; color:${color};`;
        div.textContent = text;
        roomsList.appendChild(div);
    }

    socket.on('live_channels_data', (payload) => {
        const rooms = Array.isArray(payload) ? payload : (payload.rooms || []);
        const error = Array.isArray(payload) ? null : payload.error;
        roomsList.innerHTML = '';
        if (error) {
            showRoomMessage(rooms.length
                ? `Could not reach ares.chat (${error}). Showing cached list.`
                : `Could not reach ares.chat (${error}). No rooms available - try Refresh later.`, '#a33');
        } else if (!rooms.length) {
            showRoomMessage('No rooms found.', '#555');
        }
        rooms.forEach(room => {
            const btn = document.createElement('button');
            btn.className = 'channel-row';
            const name = document.createElement('span');
            name.textContent = `# ${room.name}`;
            const users = document.createElement('span');
            users.className = 'user-counter';
            users.textContent = `[${room.users}]`;
            btn.append(name, ' ', users);
            btn.onclick = () => connectToRoom(room.ip, room.port, room.name);
            roomsList.appendChild(btn);
        });
    });

    socket.on('connect_error', () => {
        roomsList.innerHTML = '';
        showRoomMessage('Cannot reach backend server.', '#a33');
    });

    function connectToRoom(ip, port, name) {
        const username = document.getElementById('username').value;
        chatBox.innerHTML = ''; 
        appendMsg('System', `Opening standard connection handshake with server room [${name}] on target ${ip}:${port}...`, 'nick-sys');
