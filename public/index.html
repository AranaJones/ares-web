<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ares Galaxy Web Chat</title>
    <style>
        :root { color-scheme: light; font: 14px Tahoma, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 16px; display: grid; place-items: center; background: #3b5998; }
        .app { width: min(950px, 100%); height: min(680px, calc(100vh - 32px)); min-height: 420px; display: flex; flex-direction: column; overflow: hidden; border: 3px solid #004efe; background: #ece9d8; box-shadow: 5px 5px 25px #0008; }
        header { padding: 9px 12px; color: white; font-weight: bold; background: linear-gradient(#1471f8, #0124b1); }
        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #888; }
        .toolbar label { font-weight: bold; }
        .toolbar input { width: 150px; padding: 5px; }
        .status { color: #444; }
        main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(190px, 260px) 1fr; background: white; }
        aside { min-height: 0; display: flex; flex-direction: column; padding: 8px; background: #f0f0f0; border-right: 2px ridge white; }
        .section-title { display: flex; justify-content: space-between; align-items: center; padding: 5px; color: white; font-weight: bold; background: #556b98; }
        button { cursor: pointer; }
        .section-title button { font-size: 12px; }
        #rooms-list { flex: 1; min-height: 0; overflow-y: auto; margin-top: 6px; padding: 4px; background: white; border: 1px inset #ccc; }
        .room { width: 100%; display: flex; justify-content: space-between; gap: 8px; padding: 7px; text-align: left; border: 0; border-bottom: 1px solid #eee; background: white; }
        .room:hover, .room[aria-current="true"] { color: white; background: #316ac5; }
        .chat { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
        #selected-room { padding: 8px 12px; border-bottom: 1px solid #ddd; color: #555; }
        #chat-box { flex: 1; overflow-y: auto; padding: 12px; }
        .message { margin: 0 0 8px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; font-family: "Courier New", monospace; }
        .message strong { color: #0000aa; }
        .message.system { color: #555; font-style: italic; }
        #chat-form { display: flex; gap: 6px; padding: 8px; background: #f1f0e6; border-top: 1px solid #888; }
        #message { flex: 1; min-width: 0; padding: 7px; font: 14px "Courier New", monospace; }
        #send-btn { padding: 5px 18px; font-weight: bold; }
        #notice { min-height: 1.5em; padding: 4px 10px; color: #555; }
        footer { display: flex; justify-content: space-between; padding: 6px 10px; border-top: 1px solid #888; color: #444; background: #ece9d8; }
        @media (max-width: 600px) {
            body { padding: 0; }
            .app { height: 100vh; min-height: 0; }
            main { grid-template-columns: minmax(120px, 35%) 1fr; }
            .toolbar { align-items: flex-start; flex-direction: column; }
            footer { gap: 8px; flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>Ares Galaxy Web Chat</header>
        <div class="toolbar">
            <label>Nickname: <input id="username" maxlength="40" value="AresUser" autocomplete="nickname"></label>
            <span class="status" id="connectionStatus" role="status">Messages are handled by the server-configured chat service.</span>
        </div>
        <main>
            <aside>
                <div class="section-title">
                    <span>Chat rooms</span>
                    <button id="refresh-rooms" type="button">Refresh</button>
                </div>
                <div id="rooms-list" aria-live="polite">Loading rooms…</div>
            </aside>
            <section class="chat" aria-label="Chat">
                <div id="selected-room">Choose a room to begin.</div>
                <div id="chat-box" aria-live="polite"></div>
                <form id="chat-form">
                    <input id="message" maxlength="4000" placeholder="Write a message…" autocomplete="off">
                    <button id="send-btn" type="submit">Send</button>
                </form>
                <div id="notice" role="status"></div>
            </section>
        </main>
        <footer><span>Room directory and chat service are configured by the server.</span><span>Ares Web Chat</span></footer>
    </div>
    <script src="/rooms.js" defer></script>
    <script src="/chat.js" defer></script>
</body>
</html>
