<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ares Web Chat</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Ares Network</p>
        <h1>Web Chat</h1>
      </div>
      <p id="connection-status" class="status" role="status">Not connected</p>
    </header>

    <form id="connect-form" class="connect-form">
      <label>Server
        <input id="host" name="host" type="text" placeholder="chat.example.org" autocomplete="url" required>
      </label>
      <label>Port
        <input id="port" name="port" type="number" min="1" max="65535" value="6566" required>
      </label>
      <label>Nickname
        <input id="nickname" name="nickname" type="text" maxlength="30" autocomplete="nickname" required>
      </label>
      <button id="connect-button" type="submit">Connect</button>
      <button id="disconnect-button" type="button" class="secondary" disabled>Disconnect</button>
    </form>

    <section class="room-heading" aria-live="polite">
      <h2 id="room-name">No room connected</h2>
      <p id="topic"></p>
    </section>

    <div class="workspace">
      <section class="chat-panel" aria-label="Chat">
        <ol id="chat-log" class="chat-log" aria-live="polite"></ol>
        <form id="message-form" class="message-form">
          <label class="visually-hidden" for="message">Message</label>
          <input id="message" type="text" maxlength="500" placeholder="Connect to a room to chat" disabled>
          <button id="send-button" type="submit" disabled>Send</button>
        </form>
      </section>
      <aside class="users-panel">
        <h2>Users <span id="user-count">0</span></h2>
        <ul id="user-list"></ul>
      </aside>
    </div>
    <footer>Browser connections use WebSockets. Deploy behind TLS and connect with WSS.</footer>
  </main>
</body>
</html>
